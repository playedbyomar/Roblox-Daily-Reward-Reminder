name: New Player Discovery

on:
  schedule:
    # 20:30 UTC: this job's probe IS the new player's FIRST notification, so the
    # run time IS the delivery time. At "0 5" that meant ~3:24-4:48am Eastern,
    # because GitHub runs crons late (observed 2.4-2.8h drift). 20:30 lands it
    # 4:30pm ET if punctual, ~7pm ET if drifted -- evening either way.
    - cron: "30 20 * * *"
  workflow_dispatch: {}

# One job per game (same scripts, different experience). Each game keeps its
# own snapshot cache and its own concurrency lane.
jobs:
  discover:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: penthouse
            universe: "6033574667"
            message: "7f7141f1-d906-504e-85f5-e235b5b91f25"
          - game: penthouse-18plus
            universe: "10777467285"
            message: "2c75087e-3aa4-0943-bb37-c659c56c146f"
    concurrency:
      group: new-player-discovery-${{ matrix.universe }}
      cancel-in-progress: false
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore known-keys snapshot
        uses: actions/cache@v4
        with:
          path: known-keys.txt
          key: known-keys-${{ matrix.universe }}-${{ github.run_id }}
          restore-keys: |
            known-keys-${{ matrix.universe }}-
      - name: Discover + seed new players
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ matrix.universe }}
          MESSAGE_ID: ${{ matrix.message }}
          DISCOVER_MAX_MINUTES: "300"
        run: node discover-new.js --write
